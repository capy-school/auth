[package]
name = "auth-rust-comparison"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
time = { version = "0.3", features = ["large-dates", "formatting", "parsing"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "time"] }
turso = { version = "=0.8.3", default-features = false }
